
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleCart - Return & Exchange</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff7f9;color:#333}
header{background:linear-gradient(90deg,#ff4d6d,#ff758f);color:white;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:26px;font-weight:bold}
.header-buttons{display:flex;gap:10px;flex-wrap:wrap}
.header-buttons button{border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:white;color:#e11d48}
.container{width:90%;max-width:900px;margin:35px auto}
.card{background:white;border-radius:12px;padding:25px;box-shadow:0 4px 15px #00000012;margin-bottom:20px}
h1{color:#e11d48;margin-bottom:10px}
h2{margin-bottom:15px;color:#444}
.order-info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.info-box{background:#fff1f2;padding:14px;border-radius:8px;overflow-wrap:anywhere}
.info-box strong{color:#e11d48}
.product{display:flex;align-items:center;gap:15px;padding:15px;border:1px solid #eee;border-radius:8px;margin-bottom:12px}
.product input[type=radio]{width:18px;height:18px;flex-shrink:0}
.product img{width:80px;height:90px;object-fit:cover;border-radius:8px;background:#f5f5f5}
.product-details{flex:1}
.product-details h3{margin-bottom:6px}
.product-details p{margin:4px 0;color:#666}
label{display:block;font-weight:bold;margin-top:18px;margin-bottom:7px}
select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;font-size:15px;background:white}
textarea{min-height:100px;resize:vertical}
.submit-btn{margin-top:20px;width:100%;padding:14px;border:none;border-radius:8px;background:#e11d48;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.success,.error{display:none;padding:15px;border-radius:8px;margin-top:20px;text-align:center;font-weight:bold;overflow-wrap:anywhere}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:30px;color:#777;line-height:1.6}
@media(max-width:650px){
 header{padding:15px 20px;flex-wrap:wrap}
 .container{width:94%}
 .order-info{grid-template-columns:1fr}
 .product{flex-wrap:wrap}
}
</style>
</head>

<body>
<header>
    <div class="logo">StyleCart</div>
    <div class="header-buttons">
        <button onclick="goOrders()">My Orders</button>
        <button onclick="goHome()">Home</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <h1>Return & Exchange</h1>
        <p>Request a return or exchange for an ordered product.</p>

        <div class="order-info">
            <div class="info-box"><strong>Order ID:</strong> <span id="orderId">-</span></div>
            <div class="info-box"><strong>Order Date:</strong> <span id="orderDate">-</span></div>
            <div class="info-box"><strong>Order Amount:</strong> ₹<span id="orderAmount">0.00</span></div>
            <div class="info-box"><strong>Status:</strong> <span id="orderStatus">-</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Select Product</h2>
        <div id="productsContainer">
            <div class="empty">Loading order products...</div>
        </div>
    </div>

    <div class="card">
        <h2>Return / Exchange Details</h2>

        <form id="returnForm">
            <label for="requestType">Request Type</label>
            <select id="requestType" required>
                <option value="Return">Return</option>
                <option value="Exchange">Exchange</option>
            </select>

            <label for="reason">Reason</label>
            <select id="reason" required>
                <option value="">Select Reason</option>
                <option value="Wrong Product">Wrong Product</option>
                <option value="Damaged Product">Damaged Product</option>
                <option value="Size Issue">Size Issue</option>
                <option value="Color Issue">Color Issue</option>
                <option value="Quality Issue">Quality Issue</option>
                <option value="Product Not Needed">Product Not Needed</option>
                <option value="Other">Other</option>
            </select>

            <label for="comment">Additional Comment</label>
            <textarea id="comment" maxlength="1000"
                placeholder="Tell us more about your request..."></textarea>

            <button class="submit-btn" id="submitBtn" type="submit">
                Submit Request
            </button>
        </form>

        <div class="success" id="successMessage"></div>
        <div class="error" id="errorMessage"></div>
    </div>
</main>

<script>
const API_URL = "http://127.0.0.1:5000";

let currentOrder = null;
let selectedProduct = null;

function getUser() {
    try {
        return JSON.parse(localStorage.getItem("stylecartUser") || "null");
    } catch (error) {
        console.error("Invalid user information:", error);
        return null;
    }
}

function getUserId() {
    const user = getUser();
    return user && (user.user_id ?? user.userId ?? user.id)
        ? (user.user_id ?? user.userId ?? user.id)
        : null;
}

function getOrderId() {
    return new URLSearchParams(window.location.search).get("order_id");
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

function money(value) {
    return Number(value || 0).toLocaleString("en-IN", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function showError(message) {
    const error = document.getElementById("errorMessage");
    document.getElementById("successMessage").style.display = "none";
    error.textContent = message;
    error.style.display = "block";
}

function showSuccess(message) {
    const success = document.getElementById("successMessage");
    document.getElementById("errorMessage").style.display = "none";
    success.textContent = message;
    success.style.display = "block";
}

async function loadOrder() {
    const orderId = getOrderId();
    const userId = getUserId();

    if (!userId) {
        document.getElementById("productsContainer").innerHTML = `
            <div class="empty">
                Please login first to submit a return or exchange request.
                <br><br>
                <a href="/customer/login.html">Go to Login</a>
            </div>`;
        document.getElementById("submitBtn").disabled = true;
        return;
    }

    if (!orderId || !/^\d+$/.test(orderId)) {
        showEmpty("Order ID is missing or invalid. Please open this page from My Orders.");
        return;
    }

    document.getElementById("orderId").textContent = orderId;

    try {
        const response = await fetch(
            `${API_URL}/api/orders/${encodeURIComponent(userId)}`
        );

        const data = await response.json();

        if (!response.ok || data.success === false) {
            throw new Error(data.message || "Unable to load your orders.");
        }

        // Handles both a direct array and {success:true, orders:[...]}.
        const orders = Array.isArray(data) ? data :
            (Array.isArray(data.orders) ? data.orders : []);

        const order = orders.find(
            item => String(item.order_id) === String(orderId)
        );

        if (!order) {
            showEmpty("This order was not found in your account.");
            return;
        }

        currentOrder = {
            ...order,
            items: Array.isArray(order.items) ? order.items :
                (Array.isArray(order.order_items) ? order.order_items : [])
        };

        renderOrder();
    } catch (error) {
        console.error("Load order error:", error);
        showEmpty("Could not load order details. Check that the Flask backend is running, then refresh this page.");
        showError(error.message || "Unable to load order details.");
    }
}

function renderOrder() {
    document.getElementById("orderId").textContent = currentOrder.order_id;
    document.getElementById("orderDate").textContent =
        currentOrder.order_date || currentOrder.created_at || "Not available";
    document.getElementById("orderAmount").textContent =
        money(currentOrder.total_amount);
    document.getElementById("orderStatus").textContent =
        currentOrder.order_status || "Pending";

    renderProducts();
}

function renderProducts() {
    const container = document.getElementById("productsContainer");
    const items = currentOrder.items || [];

    if (!items.length) {
        container.innerHTML = '<div class="empty">No products were found for this order.</div>';
        return;
    }

    container.innerHTML = items.map((item, index) => {
        const name = item.product_name || item.productName || "Product";
        const image = item.image_url || item.imageUrl ||
            "https://via.placeholder.com/100x120?text=StyleCart";
        const quantity = Number(item.quantity || 1);
        const price = Number(item.price || 0);

        return `
            <label class="product" style="margin:0 0 12px;cursor:pointer">
                <input type="radio" name="selectedProduct" value="${index}"
                    onchange="selectProduct(${index})">
                <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}"
                    onerror="this.onerror=null;this.src='https://via.placeholder.com/100x120?text=StyleCart'">
                <div class="product-details">
                    <h3>${escapeHtml(name)}</h3>
                    <p>Price: ₹${money(price)}</p>
                    <p>Quantity: ${quantity}</p>
                </div>
            </label>`;
    }).join("");
}

function selectProduct(index) {
    selectedProduct = currentOrder.items[index] || null;
}

document.getElementById("returnForm").addEventListener("submit", submitRequest);

async function submitRequest(event) {
    event.preventDefault();

    document.getElementById("successMessage").style.display = "none";
    document.getElementById("errorMessage").style.display = "none";

    if (!currentOrder) {
        showError("Order information not found. Please reopen this page from My Orders.");
        return;
    }

    if (!selectedProduct) {
        showError("Please select a product.");
        return;
    }

    const userId = getUserId();
    if (!userId) {
        showError("Your login session was not found. Please login again.");
        return;
    }

    const reason = document.getElementById("reason").value;
    if (!reason) {
        showError("Please select a reason.");
        return;
    }

    const requestType = document.getElementById("requestType").value;
    const orderItemId = selectedProduct.order_item_id ??
        selectedProduct.orderItemId ?? null;

    const payload = {
        user_id: Number(userId),
        order_id: Number(currentOrder.order_id),
        order_item_id: orderItemId ? Number(orderItemId) : null,
        request_type: requestType,
        reason: reason,
        comment: document.getElementById("comment").value.trim()
    };

    if (!Number.isFinite(payload.order_id)) {
        showError("Invalid order ID. Please reopen this page from My Orders.");
        return;
    }

    const button = document.getElementById("submitBtn");
    button.disabled = true;
    button.textContent = "Submitting...";

    try {
        const response = await fetch(`${API_URL}/api/return-requests`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || result.success === false) {
            throw new Error(result.message || "The backend rejected the request.");
        }

        showSuccess(result.message || "Return / Exchange request submitted successfully!");
        document.getElementById("comment").value = "";
        document.getElementById("reason").value = "";
        document.querySelectorAll('input[name="selectedProduct"]').forEach(radio => {
            radio.checked = false;
        });
        selectedProduct = null;
    } catch (error) {
        console.error("Submit return request error:", error);
        showError(
            "Request was not confirmed by the backend: " +
            (error.message || "Connection failed.") +
            " Please check the Flask terminal and try again. Do not assume the request was saved."
        );
    } finally {
        button.disabled = false;
        button.textContent = "Submit Request";
    }
}

function showEmpty(message) {
    document.getElementById("productsContainer").innerHTML =
        `<div class="empty">${escapeHtml(message)}</div>`;
}

function goOrders() {
    window.location.href = "/customer/order.html";
}

function goHome() {
    window.location.href = "/customer/home.html";
}

loadOrder();
</script>
</body>
</html>
