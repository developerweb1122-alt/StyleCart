<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>StyleCart - Forgot Password</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #fff1f2, #fce7f3);
    }

    .forgot-container {
        width: 400px;
        background: #fff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .logo {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #e11d48;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 9px;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: #e11d48;
        box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
    }

    .reset-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 9px;
        background: #e11d48;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .reset-btn:hover {
        background: #be123c;
    }

    .error {
        color: #dc2626;
        font-size: 12px;
        margin-top: 5px;
        display: block;
    }

    .success {
        color: #16a34a;
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .back-login {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }

    .back-login a {
        color: #e11d48;
        font-weight: bold;
        text-decoration: none;
    }

    #passwordSection {
        display: none;
    }

    @media (max-width: 480px) {
        .forgot-container {
            width: 90%;
            padding: 25px;
        }
    }
</style>


</head>

<body>


<div class="forgot-container">

    <div class="logo">
        StyleCart
    </div>

    <p class="subtitle">
        Forgot your password?
        Enter your registered email to reset it.
    </p>

    <!-- EMAIL FORM -->
    <form id="emailForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
            >

            <span
                class="error"
                id="emailError">
            </span>

        </div>

        <button
            type="submit"
            class="reset-btn">
            Check Email
        </button>

    </form>


    <!-- PASSWORD RESET FORM -->
    <form id="passwordForm">

        <div id="passwordSection">

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >

                <span
                    class="error"
                    id="passwordError">
                </span>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                >

                <span
                    class="error"
                    id="confirmError">
                </span>

            </div>


            <button
                type="submit"
                class="reset-btn">
                Reset Password
            </button>

        </div>

    </form>


    <p
        class="success"
        id="successMessage">
    </p>


    <p class="back-login">

        Remember your password?

        <a href="login.html">
            Login
        </a>

    </p>

</div>


<script>

    const emailForm =
        document.getElementById("emailForm");

    const passwordForm =
        document.getElementById("passwordForm");

    const passwordSection =
        document.getElementById("passwordSection");


    // STEP 1: CHECK EMAIL

    emailForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();


        const emailError =
            document.getElementById("emailError");

        const successMessage =
            document.getElementById("successMessage");


        emailError.textContent = "";
        successMessage.textContent = "";


        if (email === "") {

            emailError.textContent =
                "Please enter your email.";

            return;
        }


        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            emailError.textContent =
                "Please enter a valid email.";

            return;
        }


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/api/check-email",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                emailError.textContent =
                    result.message ||
                    "Email not found.";

                return;
            }


            successMessage.textContent =
                "Email verified. Enter your new password.";


            emailForm.style.display = "none";

            passwordSection.style.display = "block";


        } catch (error) {

            emailError.textContent =
                "Unable to connect to server.";

            console.error(error);

        }

    });


    // STEP 2: RESET PASSWORD

    passwordForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        const passwordError =
            document.getElementById("passwordError");

        const confirmError =
            document.getElementById("confirmError");

        const successMessage =
            document.getElementById("successMessage");


        passwordError.textContent = "";
        confirmError.textContent = "";
        successMessage.textContent = "";


        if (newPassword === "") {

            passwordError.textContent =
                "Please enter a new password.";

            return;
        }


        if (newPassword.length < 6) {

            passwordError.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        if (confirmPassword === "") {

            confirmError.textContent =
                "Please confirm your password.";

            return;
        }


        if (newPassword !== confirmPassword) {

            confirmError.textContent =
                "Passwords do not match.";

            return;
        }


        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/api/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            new_password: newPassword

                        })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                passwordError.textContent =
                    result.message ||
                    "Password reset failed.";

                return;
            }


            successMessage.textContent =
                "Password reset successfully! Redirecting to login...";


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2000);


        } catch (error) {

            passwordError.textContent =
                "Unable to connect to server.";

            console.error(error);

        }

    });

</script>


</body>

</html>
