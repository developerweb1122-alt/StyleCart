<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleCart - Order Tracking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* HEADER */

        header {
            background: white;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #ff4d6d;
            cursor: pointer;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        .header-btn:hover {
            background: #e83e5b;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 900px;
            margin: 45px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #777;
        }

        /* ORDER CARD */

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .order-id {
            font-weight: bold;
        }

        .status {
            background: #e8f8ee;
            color: #168344;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        /* TRACKING */

        .tracking {
            position: relative;
            display: flex;
            justify-content: space-between;
            margin: 40px 10px;
        }

        .tracking::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 8%;
            right: 8%;
            height: 4px;
            background: #ddd;
            z-index: 0;
        }

        .step {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 20%;
        }

        .circle {
            width: 38px;
            height: 38px;
            margin: auto;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .step.active .circle {
            background: #ff4d6d;
        }

        .step.completed .circle {
            background: #28a745;
        }

        .step p {
            margin-top: 10px;
            font-size: 13px;
            color: #777;
        }

        .step.active p,
        .step.completed p {
            color: #222;
            font-weight: bold;
        }

        /* ORDER INFORMATION */

        .info-section {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .info-section h3 {
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #555;
        }

        /* PRODUCTS */

        .products-list {
            margin-top: 15px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #ff4d6d;
            margin-top: 18px;
        }

        /* EMPTY */

        .empty {
            background: white;
            text-align: center;
            padding: 50px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;
            margin-bottom: 20px;
        }

        .shop-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            header {
                flex-wrap: wrap;
                gap: 12px;
            }

            .tracking {
                margin: 35px 0;
            }

            .tracking::before {
                display: none;
            }

            .step {
                width: 20%;
            }

            .circle {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            .step p {
                font-size: 10px;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div
            class="logo"
            onclick="goHome()"
        >
            StyleCart
        </div>

        <div class="header-buttons">

            <button
                class="header-btn"
                onclick="goOrders()"
            >
                My Orders
            </button>

            <button
                class="header-btn"
                onclick="goHome()"
            >
                Home
            </button>

        </div>

    </header>



    <!-- MAIN -->

    <main class="container">

        <div class="page-title">

            <h1>
                Track Your Order 📦
            </h1>

            <p>
                Check the current status of your StyleCart order
            </p>

        </div>


        <!-- ORDER AREA -->

        <div id="orderArea"></div>

    </main>



    <script>

        /* GET ORDER */

        const order =
            JSON.parse(
                localStorage.getItem("latestOrder")
            );


        /* DISPLAY ORDER */

        function displayOrder() {

            const orderArea =
                document.getElementById("orderArea");


            if (!order) {

                orderArea.innerHTML = `

                    <div class="empty">

                        <h2>
                            No Order Found
                        </h2>

                        <p>
                            You have not placed an order yet.
                        </p>

                        <button
                            class="shop-btn"
                            onclick="goHome()"
                        >
                            Start Shopping
                        </button>

                    </div>

                `;

                return;

            }


            let productsHTML = "";


            order.items.forEach(function(item) {

                productsHTML += `

                    <div class="product-item">

                        <span>
                            ${item.name}
                        </span>

                        <span>
                            ₹${item.price}
                        </span>

                    </div>

                `;

            });


            orderArea.innerHTML = `

                <div class="order-card">

                    <div class="order-header">

                        <div class="order-id">
                            Order ID:
                            ${order.orderId}
                        </div>

                        <div class="status">
                            Order Placed
                        </div>

                    </div>


                    <!-- TRACKING -->

                    <div class="tracking">

                        <div class="step completed">

                            <div class="circle">
                                ✓
                            </div>

                            <p>
                                Placed
                            </p>

                        </div>


                        <div class="step active">

                            <div class="circle">
                                2
                            </div>

                            <p>
                                Processing
                            </p>

                        </div>


                        <div class="step">

                            <div class="circle">
                                3
                            </div>

                            <p>
                                Shipped
                            </p>

                        </div>


                        <div class="step">

                            <div class="circle">
                                4
                            </div>

                            <p>
                                Out for Delivery
                            </p>

                        </div>


                        <div class="step">

                            <div class="circle">
                                5
                            </div>

                            <p>
                                Delivered
                            </p>

                        </div>

                    </div>


                    <!-- CUSTOMER INFORMATION -->

                    <div class="info-section">

                        <h3>
                            Delivery Details
                        </h3>

                        <div class="info-row">

                            <span>
                                Name
                            </span>

                            <strong>
                                ${order.customer.name}
                            </strong>

                        </div>

                        <div class="info-row">

                            <span>
                                Mobile
                            </span>

                            <strong>
                                ${order.customer.mobile}
                            </strong>

                        </div>

                        <div class="info-row">

                            <span>
                                Address
                            </span>

                            <strong>
                                ${order.customer.address},
                                ${order.customer.city},
                                ${order.customer.state}
                            </strong>

                        </div>

                        <div class="info-row">

                            <span>
                                Pincode
                            </span>

                            <strong>
                                ${order.customer.pincode}
                            </strong>

                        </div>

                    </div>


                    <!-- PRODUCTS -->

                    <div class="info-section">

                        <h3>
                            Ordered Products
                        </h3>

                        <div class="products-list">

                            ${productsHTML}

                        </div>

                        <div class="total">

                            Total:
                            ₹${order.totalAmount}

                        </div>

                    </div>

                </div>

            `;

        }



        /* NAVIGATION */

        function goHome() {

            window.location.href =
                "home.html";

        }


        function goOrders() {

            window.location.href =
                "orders.html";

        }



        /* LOAD */

        displayOrder();

    </script>

</body>

</html>
