<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleCart - Checkout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff7f9;
            color: #333;
        }

        header {
            background: linear-gradient(90deg, #ff4d6d, #ff758f);
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        h2 {
            margin-bottom: 25px;
            color: #e11d48;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card h3 {
            color: #e11d48;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .payment-option input {
            width: 18px;
            height: 18px;
        }

        .coupon-box {
            display: flex;
            gap: 10px;
        }

        .coupon-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        #applyCouponButton {
            background: #e11d48;
            color: white;
            min-width: 90px;
        }

        #applyCouponButton:hover {
            background: #be123c;
        }

        #applyCouponButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .coupon-message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .cart-item-info {
            color: #777;
            font-size: 14px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }

        .total-row {
            border-top: 2px solid #eee;
            margin-top: 10px;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #e11d48;
        }

        #placeOrderButton {
            width: 100%;
            background: #e11d48;
            color: white;
            font-size: 17px;
            margin-top: 20px;
        }

        #placeOrderButton:hover {
            background: #be123c;
        }

        #placeOrderButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .success-message,
        .error-message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px 20px;
            }

            nav a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>StyleCart</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>

<div class="container">

    <h2>Checkout</h2>

    <div class="checkout-grid">

        <!-- LEFT SIDE -->
        <div>

            <!-- DELIVERY ADDRESS -->
            <div class="card">

                <h3>Delivery Address</h3>

                <label for="shippingAddress">
                    Enter your complete address
                </label>

                <textarea
                    id="shippingAddress"
                    placeholder="House No, Street, Area, City, State, PIN Code"></textarea>

            </div>


            <!-- PAYMENT -->
            <div class="card">

                <h3>Payment Method</h3>

                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="COD"
                        checked>

                    <span>Cash on Delivery</span>

                </label>

                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="UPI">

                    <span>UPI</span>

                </label>

                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="CARD">

                    <span>Credit / Debit Card</span>

                </label>

            </div>


            <!-- COUPON -->
            <div class="card">

                <h3>Apply Coupon</h3>

                <div class="coupon-box">

                    <input
                        type="text"
                        id="couponCode"
                        placeholder="Enter coupon code"
                        autocomplete="off">

                    <button
                        type="button"
                        id="applyCouponButton">

                        Apply

                    </button>

                </div>

                <div
                    id="couponMessage"
                    class="coupon-message">
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div>

            <!-- ORDER SUMMARY -->
            <div class="card">

                <h3>Order Summary</h3>

                <div id="orderItems">

                    <div class="loading">
                        Loading cart...
                    </div>

                </div>

            </div>


            <!-- PRICE DETAILS -->
            <div class="card">

                <h3>Price Details</h3>

                <div class="price-row">

                    <span>Subtotal</span>

                    <span>
                        ₹<span id="subtotal">0.00</span>
                    </span>

                </div>


                <div
                    class="price-row"
                    id="discountRow"
                    style="display:none;">

                    <span>Coupon Discount</span>

                    <span>
                        -₹<span id="discountAmount">0.00</span>
                    </span>

                </div>


                <div class="price-row total-row">

                    <span>Total Amount</span>

                    <span>
                        ₹<span id="totalAmount">0.00</span>
                    </span>

                </div>


                <button
                    type="button"
                    id="placeOrderButton"
                    disabled>

                    Place Order

                </button>


                <div
                    id="successMessage"
                    class="success-message">

                    Order placed successfully!

                </div>


                <div
                    id="errorMessage"
                    class="error-message">
                </div>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:5000";

let cartItems = [];

let appliedCoupon = null;

let appliedDiscount = 0;

let originalSubtotal = 0;


/* =====================================================
   GET LOGGED-IN USER
===================================================== */

let savedUser = null;

try {

    savedUser = JSON.parse(
        localStorage.getItem("stylecartUser")
    );

} catch (error) {

    console.error(
        "User data error:",
        error
    );

    savedUser = null;

}


if (!savedUser || !savedUser.user_id) {

    alert("Please login first.");

    window.location.href = "login.html";

}


/* =====================================================
   LOAD CART
===================================================== */

async function loadCart() {

    try {

        const response = await fetch(
            `${API_URL}/api/cart/${savedUser.user_id}`
        );

        const data = await response.json();

        console.log(
            "Checkout Cart API Response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load cart"
            );

        }


        if (Array.isArray(data)) {

            cartItems = data;

        }

        else if (
            data &&
            Array.isArray(data.cart)
        ) {

            cartItems = data.cart;

        }

        else if (
            data &&
            Array.isArray(data.data)
        ) {

            cartItems = data.data;

        }

        else {

            cartItems = [];

        }


        console.log(
            "Checkout Cart Items:",
            cartItems
        );


        displayCart();

    }

    catch (error) {

        console.error(
            "Checkout Cart Error:",
            error
        );

        document.getElementById(
            "orderItems"
        ).innerHTML = `

            <p style="color:#991b1b;">
                Unable to load cart.
            </p>

        `;

    }

}


/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart() {

    const container =
        document.getElementById(
            "orderItems"
        );


    if (
        !cartItems ||
        cartItems.length === 0
    ) {

        container.innerHTML = `

            <p>Your cart is empty.</p>

        `;


        document.getElementById(
            "placeOrderButton"
        ).disabled = true;

        return;

    }


    let html = "";

    originalSubtotal = 0;


    cartItems.forEach(item => {

        const price =
            Number(item.price || 0);

        const quantity =
            Number(item.quantity || 0);

        const itemTotal =
            price * quantity;


        originalSubtotal += itemTotal;


        html += `

            <div class="cart-item">

                <div>

                    <div class="cart-item-name">
                        ${item.product_name || "Product"}
                    </div>

                    <div class="cart-item-info">

                        ₹${price.toFixed(2)}
                        ×
                        ${quantity}

                    </div>

                </div>


                <strong>
                    ₹${itemTotal.toFixed(2)}
                </strong>

            </div>

        `;

    });


    container.innerHTML = html;


    document.getElementById(
        "subtotal"
    ).textContent =
        originalSubtotal.toFixed(2);


    updateTotal();


    document.getElementById(
        "placeOrderButton"
    ).disabled = false;

}


/* =====================================================
   UPDATE TOTAL
===================================================== */

function updateTotal() {

    const total =
        Math.max(
            originalSubtotal - appliedDiscount,
            0
        );


    document.getElementById(
        "discountAmount"
    ).textContent =
        appliedDiscount.toFixed(2);


    document.getElementById(
        "totalAmount"
    ).textContent =
        total.toFixed(2);


    const discountRow =
        document.getElementById(
            "discountRow"
        );


    if (appliedDiscount > 0) {

        discountRow.style.display = "flex";

    }

    else {

        discountRow.style.display = "none";

    }

}


/* =====================================================
   APPLY COUPON
===================================================== */

async function applyCoupon() {

    const couponInput =
        document.getElementById(
            "couponCode"
        );


    const message =
        document.getElementById(
            "couponMessage"
        );


    const applyButton =
        document.getElementById(
            "applyCouponButton"
        );


    const couponCode =
        couponInput.value
            .trim()
            .toUpperCase();


    console.log(
        "Coupon entered:",
        couponCode
    );


    if (!couponCode) {

        message.style.color =
            "#991b1b";

        message.textContent =
            "Please enter coupon code.";

        return;

    }


    if (originalSubtotal <= 0) {

        message.style.color =
            "#991b1b";

        message.textContent =
            "Cart is empty.";

        return;

    }


    try {

        applyButton.disabled = true;

        applyButton.textContent =
            "Checking...";


        const couponRequest = {

            offer_code: couponCode,

            coupon_code: couponCode,

            code: couponCode,

            order_amount:
                originalSubtotal

        };


        console.log(
            "Coupon Request:",
            couponRequest
        );


        const response = await fetch(

            `${API_URL}/api/offers/validate`,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(
                        couponRequest
                    )

            }

        );


        const data =
            await response.json();


        console.log(
            "Coupon API Status:",
            response.status
        );


        console.log(
            "Coupon API Response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Coupon validation failed."
            );

        }


        if (
            data.valid === false ||
            data.success === false
        ) {

            throw new Error(
                data.message ||
                "Invalid or inactive coupon."
            );

        }


        let discount =
            Number(
                data.discount_amount
            );


        if (
            !Number.isFinite(discount) ||
            discount <= 0
        ) {

            const percentage =
                Number(
                    data.discount_percentage || 0
                );


            if (percentage > 0) {

                discount =
                    originalSubtotal *
                    percentage /
                    100;

            }

        }


        discount =
            Math.min(
                Math.max(discount, 0),
                originalSubtotal
            );


        if (discount <= 0) {

            throw new Error(
                data.message ||
                "Coupon is valid but no discount was returned."
            );

        }


        appliedCoupon =
            data.offer_code ||
            data.coupon_code ||
            couponCode;


        appliedDiscount =
            discount;


        message.style.color =
            "#166534";


        message.textContent =
            `${data.offer_name || "Coupon"} applied successfully. Discount: ₹${discount.toFixed(2)}`;


        updateTotal();


        console.log(
            "Applied Coupon:",
            appliedCoupon
        );


        console.log(
            "Applied Discount:",
            appliedDiscount
        );

    }

    catch (error) {

        console.error(
            "Coupon Error:",
            error
        );


        appliedCoupon = null;

        appliedDiscount = 0;


        updateTotal();


        message.style.color =
            "#991b1b";


        message.textContent =
            error.message ||
            "Unable to apply coupon.";

    }

    finally {

        applyButton.disabled = false;

        applyButton.textContent =
            "Apply";

    }

}


/* =====================================================
   APPLY COUPON BUTTON
===================================================== */

document
    .getElementById(
        "applyCouponButton"
    )
    .addEventListener(
        "click",
        applyCoupon
    );


/* =====================================================
   ENTER KEY FOR COUPON
===================================================== */

document
    .getElementById(
        "couponCode"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                applyCoupon();

            }

        }
    );


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

    const successMessage =
        document.getElementById(
            "successMessage"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    successMessage.style.display =
        "none";


    errorMessage.style.display =
        "none";


    const shippingAddress =
        document.getElementById(
            "shippingAddress"
        ).value.trim();


    if (!shippingAddress) {

        errorMessage.textContent =
            "Please enter delivery address.";

        errorMessage.style.display =
            "block";

        return;

    }


    if (
        !cartItems ||
        cartItems.length === 0
    ) {

        errorMessage.textContent =
            "Your cart is empty.";

        errorMessage.style.display =
            "block";

        return;

    }


    const paymentElement =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    if (!paymentElement) {

        errorMessage.textContent =
            "Please select payment method.";

        errorMessage.style.display =
            "block";

        return;

    }


    const payment =
        paymentElement.value;


    const orderItemsData =
        cartItems.map(item => ({

            product_id:
                item.product_id,

            quantity:
                Number(item.quantity)

        }));


    try {

        button.disabled = true;

        button.textContent =
            "Placing Order...";


        const orderPayload = {

            user_id:
                savedUser.user_id,

            shipping_address:
                shippingAddress,

            payment_method:
                payment,

            items:
                orderItemsData,

            offer_code:
                appliedCoupon,

            coupon_code:
                appliedCoupon

        };


        console.log(
            "Place Order Request:",
            orderPayload
        );


        const orderResponse =
            await fetch(

                `${API_URL}/api/orders`,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            orderPayload
                        )

                }

            );


        const orderData =
            await orderResponse.json();


        console.log(
            "Place Order Response:",
            orderData
        );


        if (!orderResponse.ok) {

            throw new Error(
                orderData.message ||
                "Unable to place order."
            );

        }


        const latestOrder = {

            order_id:
                orderData.order_id,

            subtotal:
                Number(
                    orderData.subtotal ||
                    originalSubtotal
                ),

            discountAmount:
                Number(
                    orderData.discount_amount ||
                    appliedDiscount ||
                    0
                ),

            total_amount:
                Number(
                    orderData.total_amount ||
                    (
                        originalSubtotal -
                        appliedDiscount
                    )
                ),

            couponCode:
                orderData.offer_code ||
                orderData.coupon_code ||
                appliedCoupon,

            status:
                orderData.status ||
                "Pending"

        };


        localStorage.setItem(
            "stylecartLatestOrder",
            JSON.stringify(
                latestOrder
            )
        );


        successMessage.textContent =
            "Order placed successfully!";


        successMessage.style.display =
            "block";


        button.textContent =
            "Order Placed ✓";


        setTimeout(() => {

            window.location.href =
                "ordersuccess.html";

        }, 2000);

    }

    catch (error) {

        console.error(
            "Place Order Error:",
            error
        );


        errorMessage.textContent =
            error.message ||
            "Unable to place order.";


        errorMessage.style.display =
            "block";


        button.disabled = false;


        button.textContent =
            "Place Order";

    }

}


/* =====================================================
   IMPORTANT:
   CONNECT PLACE ORDER BUTTON
===================================================== */

document
    .getElementById(
        "placeOrderButton"
    )
    .addEventListener(
        "click",
        placeOrder
    );


/* =====================================================
   START
===================================================== */

loadCart();

</script>

</body>
</html>
