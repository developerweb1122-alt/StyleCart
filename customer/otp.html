<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleCart - OTP Verification</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff1f2, #fce7f3);
        }

        .otp-container {
            width: 400px;
            background: #fff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e11d48;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .email-display {
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 24px;
            text-align: center;
            letter-spacing: 10px;
        }

        .otp-input:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
        }

        .verify-btn {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #e11d48;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-btn:hover {
            background: #be123c;
        }

        .resend {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .resend button {
            border: none;
            background: none;
            color: #e11d48;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 10px;
        }

        .success {
            color: #16a34a;
            font-size: 14px;
            margin-top: 15px;
        }

        .back-login {
            margin-top: 20px;
            font-size: 14px;
        }

        .back-login a {
            color: #e11d48;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 480px) {

            .otp-container {
                width: 90%;
                padding: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="otp-container">

        <div class="logo">
            StyleCart
        </div>

        <p class="subtitle">
            Verify your account
        </p>

        <p class="email-display">
            Enter the OTP sent to your email
        </p>


        <form id="otpForm">

            <input
                type="text"
                id="otp"
                class="otp-input"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
            >


            <p
                class="error"
                id="otpError">
            </p>


            <button
                type="submit"
                class="verify-btn">
                Verify OTP
            </button>


            <p
                class="success"
                id="successMessage">
            </p>

        </form>


        <div class="resend">

            Didn't receive the OTP?

            <button
                type="button"
                id="resendBtn">
                Resend OTP
            </button>

        </div>


        <p class="back-login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script>

        const otpForm = document.getElementById("otpForm");

        const otpInput = document.getElementById("otp");

        const otpError = document.getElementById("otpError");

        const successMessage =
            document.getElementById("successMessage");


        otpForm.addEventListener("submit", function(event) {

            event.preventDefault();


            otpError.textContent = "";

            successMessage.textContent = "";


            const otp = otpInput.value.trim();


            // Check OTP length

            if (otp === "") {

                otpError.textContent =
                    "Please enter the OTP.";

                return;

            }


            if (!/^\d{6}$/.test(otp)) {

                otpError.textContent =
                    "OTP must contain 6 digits.";

                return;

            }


            /*
                IMPORTANT:

                This is currently frontend/demo verification.

                Real OTP verification will be connected
                with backend/API later.
            */


            if (otp === "123456") {

                successMessage.textContent =
                    "OTP verified successfully!";

                setTimeout(function() {

                    window.location.href = "login.html";

                }, 1500);

            } else {

                otpError.textContent =
                    "Invalid OTP. Please try again.";

            }

        });


        // Resend OTP

        document.getElementById("resendBtn")
            .addEventListener("click", function() {

                otpError.textContent = "";

                successMessage.textContent =
                    "A new OTP has been sent.";

            });

    </script>

</body>

</html>
