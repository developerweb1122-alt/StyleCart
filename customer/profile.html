<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleCart - My Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fdf2f8;
            color: #333;
        }

        /* HEADER */

        header {
            background: linear-gradient(90deg, #ec4899, #db2777);
            color: white;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        header button {
            background: white;
            color: #db2777;

            border: none;
            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 900px;

            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            color: #db2777;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        /* PROFILE CARD */

        .profile-card {
            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fce7f3;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 45px;
        }

        .profile-name {
            text-align: center;

            font-size: 24px;

            color: #db2777;

            margin-bottom: 25px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #ec4899;
        }

        .form-group textarea {

            height: 90px;

            resize: none;
        }

        .save-btn {

            width: 100%;

            padding: 13px;

            background: #db2777;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn:hover {

            background: #be185d;
        }

        /* ACCOUNT OPTIONS */

        .options {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .options h3 {

            color: #db2777;

            margin-bottom: 18px;
        }

        .option {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px;

            border-bottom: 1px solid #eee;
        }

        .option:last-child {

            border-bottom: none;
        }

        .option span {

            font-weight: bold;
        }

        .option button {

            background: #fce7f3;

            color: #db2777;

            border: none;

            padding: 9px 15px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .option button:hover {

            background: #fbcfe8;
        }

        .logout-btn {

            background: #fee2e2 !important;

            color: #dc2626 !important;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {

                padding: 15px 20px;

            }

            .header-buttons {

                flex-direction: column;

            }

            .profile-card,
            .options {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>StyleCart</h1>

    <div class="header-buttons">

        <button onclick="goHome()">
            Home
        </button>

        <button onclick="goProducts()">
            Products
        </button>

    </div>

</header>


<!-- MAIN -->

<div class="container">


    <div class="title">

        <h2>My Profile</h2>

        <p>
            Manage your StyleCart account
        </p>

    </div>


    <!-- PROFILE -->

    <div class="profile-card">

        <div class="profile-icon">
            👤
        </div>

        <div class="profile-name" id="profileName">
            StyleCart User
        </div>


        <form id="profileForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    placeholder="Enter mobile number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                ></textarea>

            </div>


            <button
                type="submit"
                class="save-btn"
            >
                Save Profile
            </button>


        </form>

    </div>


    <!-- ACCOUNT OPTIONS -->

    <div class="options">

        <h3>
            Account Options
        </h3>


        <div class="option">

            <span>
                📦 My Orders
            </span>

            <button onclick="goOrders()">
                View Orders
            </button>

        </div>


        <div class="option">

            <span>
                🛒 My Cart
            </span>

            <button onclick="goCart()">
                View Cart
            </button>

        </div>


        <div class="option">

            <span>
                🏠 Home
            </span>

            <button onclick="goHome()">
                Open
            </button>

        </div>


        <div class="option">

            <span>
                🚪 Logout
            </span>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


    </div>


</div>


<script>


    /* LOAD PROFILE */

    let profile =
        JSON.parse(
            localStorage.getItem("profile")
        );


    if (profile) {

        document.getElementById("name").value =
            profile.name || "";

        document.getElementById("email").value =
            profile.email || "";

        document.getElementById("mobile").value =
            profile.mobile || "";

        document.getElementById("address").value =
            profile.address || "";

        document.getElementById("profileName").textContent =
            profile.name || "StyleCart User";

    }


    /* SAVE PROFILE */

    document
        .getElementById("profileForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            let name =
                document.getElementById("name")
                .value.trim();

            let email =
                document.getElementById("email")
                .value.trim();

            let mobile =
                document.getElementById("mobile")
                .value.trim();

            let address =
                document.getElementById("address")
                .value.trim();


            if (!/^[0-9]{10}$/.test(mobile)) {

                alert(
                    "Please enter a valid 10 digit mobile number."
                );

                return;

            }


            let profileData = {

                name: name,

                email: email,

                mobile: mobile,

                address: address

            };


            localStorage.setItem(
                "profile",
                JSON.stringify(profileData)
            );


            document.getElementById(
                "profileName"
            ).textContent = name;


            alert(
                "Profile saved successfully!"
            );

        });


    /* NAVIGATION */


    function goHome() {

        window.location.href =
            "home.html";

    }


    function goProducts() {

        window.location.href =
            "product.html";

    }


    function goOrders() {

        window.location.href =
            "orders.html";

    }


    function goCart() {

        window.location.href =
            "cart.html";

    }


    function logout() {

        let confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (confirmLogout) {

            window.location.href =
                "logout.html";

        }

    }


</script>


</body>

</html>
