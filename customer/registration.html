<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>StyleCart - Create Account</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #fff1f2, #fce7f3);
    }

    .register-container {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .logo {
        text-align: center;
        color: #e11d48;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .heading {
        text-align: center;
        font-size: 24px;
        color: #333;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #e11d48;
        box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.08);
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 60px;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #e11d48;
        font-size: 13px;
        cursor: pointer;
        font-weight: bold;
    }

    .error {
        display: block;
        color: #dc2626;
        font-size: 12px;
        margin-top: 5px;
    }

    .terms {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 8px;
    }

    .terms input {
        width: auto;
        margin-top: 2px;
    }

    .terms label {
        margin: 0;
        font-weight: normal;
        font-size: 13px;
        line-height: 18px;
    }

    .terms a {
        color: #e11d48;
        text-decoration: none;
    }

    .register-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #e11d48, #fb7185);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        transition: 0.3s;
    }

    .register-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .register-btn:active {
        transform: translateY(0);
    }

    #successMessage {
        display: block;
        text-align: center;
        color: #16a34a;
        font-size: 14px;
        font-weight: bold;
        margin-top: 15px;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }

    .login-link a {
        color: #e11d48;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 450px) {
        .register-container {
            width: 92%;
            padding: 25px;
        }
    }
</style>


</head>

<body>

<div class="register-container">

    <div class="logo">StyleCart</div>

    <h2 class="heading">Create Account</h2>

    <p class="subtitle">
        Create your StyleCart account
    </p>

    <form id="registerForm">

        <!-- Full Name -->
        <div class="form-group">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <span id="nameError" class="error"></span>

        </div>

        <!-- Email -->
        <div class="form-group">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <span id="emailError" class="error"></span>

        </div>

        <!-- Phone -->
        <div class="form-group">

            <label for="phone">Mobile Number</label>

            <input
                type="text"
                id="phone"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
            >

            <span id="phoneError" class="error"></span>

        </div>

        <!-- Password -->
        <div class="form-group">

            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('password', this)"
                >
                    Show
                </span>

            </div>

            <span id="passwordError" class="error"></span>

        </div>

        <!-- Confirm Password -->
        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', this)"
                >
                    Show
                </span>

            </div>

            <span id="confirmPasswordError" class="error"></span>

        </div>

        <!-- Terms -->
        <div class="terms">

            <input
                type="checkbox"
                id="terms"
            >

            <label for="terms">
                I agree to the
                <a href="#" onclick="return false;">
                    Terms & Conditions
                </a>
            </label>

        </div>

        <span id="termsError" class="error"></span>

        <!-- Register Button -->
        <button
            type="submit"
            class="register-btn"
        >
            Create Account
        </button>

        <!-- Success Message -->
        <span id="successMessage"></span>

    </form>

    <!-- Login -->
    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>

<script>

    const form = document.getElementById("registerForm");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        // Clear previous errors
        document.querySelectorAll(".error").forEach(error => {
            error.textContent = "";
        });

        document.getElementById("successMessage").textContent = "";

        // Get form values
        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const terms =
            document.getElementById("terms").checked;

        let isValid = true;

        // Name validation
        if (name.length < 3) {

            document.getElementById("nameError").textContent =
                "Please enter a valid name.";

            isValid = false;
        }

        // Email validation
        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            document.getElementById("emailError").textContent =
                "Please enter a valid email.";

            isValid = false;
        }

        // Phone validation
        const phonePattern =
            /^[6-9]\d{9}$/;

        if (!phonePattern.test(phone)) {

            document.getElementById("phoneError").textContent =
                "Enter a valid 10-digit mobile number.";

            isValid = false;
        }

        // Password validation
        if (password.length < 8) {

            document.getElementById("passwordError").textContent =
                "Password must contain at least 8 characters.";

            isValid = false;
        }

        // Confirm password
        if (password !== confirmPassword) {

            document.getElementById("confirmPasswordError").textContent =
                "Passwords do not match.";

            isValid = false;
        }

        // Terms validation
        if (!terms) {

            document.getElementById("termsError").textContent =
                "Please accept Terms & Conditions.";

            isValid = false;
        }

        // Stop if validation failed
        if (!isValid) {
            return;
        }

        // Send data to Flask Backend
        try {

            const response = await fetch(
                "http://127.0.0.1:5000/api/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        full_name: name,
                        email: email,
                        phone: phone,
                        password: password

                    })
                }
            );

            const result = await response.json();

            // Registration successful
            if (response.ok) {

                document.getElementById(
                    "successMessage"
                ).textContent =
                    result.message;

                form.reset();

            }

            // Registration failed
            else {

                document.getElementById(
                    "emailError"
                ).textContent =
                    result.message;

            }

        }

        catch (error) {

            console.error(
                "Registration Error:",
                error
            );

            document.getElementById(
                "successMessage"
            ).textContent =
                "Backend server is not connected.";

        }

    });


    // Show / Hide Password
    function togglePassword(inputId, element) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            element.textContent = "Hide";

        }

        else {

            input.type = "password";

            element.textContent = "Show";

        }

    }

</script>


</body>

</html>
